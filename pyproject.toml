[project]
name = "instagram-catalog-pipeline"
version = "0.1.0"
description = "POC: cascade AI pipeline turning a vendor Instagram feed into a structured catalog + attention flags"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "imagehash>=4.3.2",
    "pillow>=12.3.0",
    "numpy>=2.4.6",
]

[tool.uv]
dev-dependencies = [
    "dvc[s3]>=3.67.1",
    "pytest>=8.0",
]

# There is still no broad test suite by design - eval/harness.py is the
# verification mechanism for model quality (see CLAUDE.md). tests/ covers
# only what the harness structurally cannot: credential handling, the
# harness's own error isolation, and deterministic Stage 5 routing. Every
# test is offline - no network, no .env, no golden-set reads.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
