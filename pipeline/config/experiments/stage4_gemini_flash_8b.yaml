name: stage4_gemini_flash_8b
description: >-
  End-to-end experiment snapshot: Stage 2 triage + Stage 3 extraction + Stage 4 signal
  detection, all on gemini-3.5-flash-lite (Google AI Studio). Not the active default;
  see default.yaml.

stage2_triage:
  module: pipeline.stages.stage2_triage
  function: triage_post
  text_model: gemini/gemini-3.5-flash-lite
  vision_model: gemini/gemini-3.5-flash-lite
  confidence_threshold: 0.7
  model: gemini-3.5-flash-lite (Google AI Studio)
  cost_per_call_usd: 0.0
  note: >-
    Google's smallest and fastest multimodal model. Free tier on AI Studio gives 15
    requests per minute.

stage3_extract:
  module: pipeline.stages.stage3_extract
  function: extract_product
  model: gemini-3.5-flash-lite (Google AI Studio)
  cost_per_call_usd: 0.0
  note: >-
    Real LLM extraction (see pipeline/stages/stage3_extract.py) - model is hardcoded
    in-module, not overridable via config, since extract_product()'s signature can't
    take a model kwarg.

stage4_signals:
  module: pipeline.stages.stage4_signals
  function: detect_signals
  model: gemini-3.5-flash-lite (Google AI Studio)
  cost_per_call_usd: 0.0
  note: >-
    Real LLM signal detection (see pipeline/stages/stage4_signals.py) - model is
    hardcoded in-module, not overridable via config, since detect_signals()'s
    signature can't take a model kwarg. Text-only, no vision escalation.
