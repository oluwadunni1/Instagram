name: stage2_gemini_cascade
description: >-
  Stage 2 Triage — Gemini Cascade (Google AI Studio). Not the active default;
  see default.yaml.

stage2_triage:
  module: pipeline.stages.stage2_triage
  function: triage_post
  text_model: gemini/gemini-3.5-flash-lite
  vision_model: gemini/gemini-3.5-flash
  confidence_threshold: 0.7
  model: Gemini Cascade (Google AI Studio)
  cost_per_call_usd: 0.0
  note: >-
    gemini-1.5-flash-8b and gemini-1.5-flash are both retired from Google AI
    Studio's model list as of 2026-09-01 - the 1.5 line is gone, current lineup is
    2.5/3.x. Substituted gemini-3.5-flash-lite (cheap text triage) and
    gemini-3.5-flash (full flash for vision escalation), preserving the original
    "cheap text / stronger vision" tiering. Google AI Studio's free tier.

stage3_extract:
  module: pipeline.stages.stage3_extract
  function: extract_product
  model: dummy-heuristic
  cost_per_call_usd: 0.0
